<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Guchho Resources</title>
    <link rel="stylesheet" href="banner.css" />
    <style>
      :root {
        --accent: #2dd4bf;
        --accent-strong: #99f6e4;
        --glow-a: rgba(13, 148, 136, 0.3);
        --glow-b: rgba(19, 78, 74, 0.3);
        --panel-glow: rgba(45, 212, 191, 0.08);
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="frame">
      <div>
        <div class="brand">
          <img src="../../public/logo.png" alt="" />
          <span class="brand-name">Guchho</span>
        </div>
        <span class="kicker">Learn more</span>
        <h1><span>Resources</span></h1>
        <p class="tagline">Benchmarks, guides, and links for going deeper.</p>
        <div class="chips">
          <span class="chip">Benchmarks</span>
          <span class="chip">Comparisons</span>
          <span class="chip">Community</span>
          <span class="chip">Support</span>
        </div>
        <p class="url"><strong>guchho.js.org</strong>/resources</p>
      </div>
      <div class="terminal">
        <div class="terminal-bar">
          <span class="dot dot-red"></span>
          <span class="dot dot-yellow"></span>
          <span class="dot dot-green"></span>
          <span class="terminal-title">guchho --info</span>
        </div>
        <div class="terminal-body">
          <div><span class="prompt">$</span> npx guchho --info</div>
          <div class="pass">✓ docs</div>
          <div class="pass">✓ benchmarks</div>
          <div class="pass">✓ comparisons</div>
          <div class="pass">✓ community</div>
          <div class="summary"><span class="pass">Curated resources</span></div>
        </div>
      </div>
    </div>
  </body>
</html>
