<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Guchho Embedding</title>
    <link rel="stylesheet" href="banner.css" />
    <style>
      :root {
        --accent: #818cf8;
        --accent-strong: #c7d2fe;
        --glow-a: rgba(79, 70, 229, 0.34);
        --glow-b: rgba(49, 46, 129, 0.32);
        --panel-glow: rgba(129, 140, 248, 0.08);
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="frame">
      <div>
        <div class="brand">
          <img src="../../public/logo.png" alt="" />
          <span class="brand-name">Guchho</span>
        </div>
        <span class="kicker">C++ integration</span>
        <h1><span>Embedding</span></h1>
        <p class="tagline">Use Guchho as a library inside native applications.</p>
        <div class="chips">
          <span class="chip">C++ API</span>
          <span class="chip">Compiler</span>
          <span class="chip">Plugins</span>
          <span class="chip">CMake</span>
        </div>
        <p class="url"><strong>guchho.js.org</strong>/embedding</p>
      </div>
      <div class="terminal">
        <div class="terminal-bar">
          <span class="dot dot-red"></span>
          <span class="dot dot-yellow"></span>
          <span class="dot dot-green"></span>
          <span class="terminal-title">embed.cpp</span>
        </div>
        <div class="terminal-body">
          <div><span class="prompt">$</span> cmake --build build</div>
          <div class="pass">✓ libguchho linked</div>
          <div class="muted">guchho::BuildOptions opts;</div>
          <div class="muted">auto result = build(opts);</div>
          <div class="summary"><span class="pass">Native API</span> <span class="dim">·</span> C++20</div>
        </div>
      </div>
    </div>
  </body>
</html>
