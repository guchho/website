<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Guchho Recipes</title>
    <link rel="stylesheet" href="banner.css" />
    <style>
      :root {
        --accent: #fb923c;
        --accent-strong: #fed7aa;
        --glow-a: rgba(234, 88, 12, 0.3);
        --glow-b: rgba(154, 52, 18, 0.3);
        --panel-glow: rgba(251, 146, 60, 0.08);
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="frame">
      <div>
        <div class="brand">
          <img src="../../public/logo.png" alt="" />
          <span class="brand-name">Guchho</span>
        </div>
        <span class="kicker">Copy-paste examples</span>
        <h1><span>Recipes</span></h1>
        <p class="tagline">Copy-paste solutions for real-world build setups.</p>
        <div class="chips">
          <span class="chip">TypeScript</span>
          <span class="chip">CSS</span>
          <span class="chip">Assets</span>
          <span class="chip">Deployment</span>
        </div>
        <p class="url"><strong>guchho.js.org</strong>/recipes</p>
      </div>
      <div class="terminal">
        <div class="terminal-bar">
          <span class="dot dot-red"></span>
          <span class="dot dot-yellow"></span>
          <span class="dot dot-green"></span>
          <span class="terminal-title">guchho build</span>
        </div>
        <div class="terminal-body">
          <div><span class="prompt">$</span> npx guchho build index.html</div>
          <div class="pass">✓ react-ts recipe</div>
          <div class="pass">✓ static-site recipe</div>
          <div class="pass">✓ library recipe</div>
          <div class="muted">→ 3 builds passed</div>
          <div class="summary"><span class="pass">12 recipes</span> <span class="dim">·</span> copy-paste ready</div>
        </div>
      </div>
    </div>
  </body>
</html>
